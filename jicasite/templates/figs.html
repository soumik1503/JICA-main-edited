{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto my-6 px-2 md:px-4">
    <div class="bg-white rounded-xl shadow-md border border-stone-200 p-4 md:p-6">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-4">
            <h1 class="text-2xl md:text-3xl font-bold text-stone-800 text-center w-full">Welcome To FIGS Application</h1>
        </div>

        <div class="overflow-x-auto border border-stone-200 rounded-lg max-w-6xl mx-auto">
            <table class="min-w-full text-sm text-left mx-auto">
                <thead class="bg-stone-100 text-stone-700">
                    <tr>
                        <th class="px-4 py-3 font-semibold">Id</th>
                        <th class="px-4 py-3 font-semibold">Name</th>
                        <th class="px-4 py-3 font-semibold">Username</th>
                        <th class="px-4 py-3 font-semibold">Email</th>
                        <th class="px-4 py-3 font-semibold">Street</th>
                        <th class="px-4 py-3 font-semibold">City</th>
                        <th class="px-4 py-3 font-semibold">Zipcode</th>
                    </tr>
                </thead>
                <tbody id="figs-table-body" class="divide-y divide-stone-200 bg-white"></tbody>
            </table>
        </div>
    </div>
</div>

{% endblock %}
